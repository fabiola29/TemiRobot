plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"
    compileSdk 33
    ndkVersion "22.1.7171670"

    defaultConfig {
        applicationId "com.example.temi1"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        resConfigs "en"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        packagingOptions {
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/NOTICE'
            exclude 'META-INF/LICENSE'
            exclude 'META-INF/LICENSE.txt'
            exclude 'META-INF/NOTICE.txt'
        }

        buildTypes {
            release {
                minifyEnabled true
                shrinkResources true
                debuggable false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // Java language implementation
    def nav_version = "2.3.3"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    // temi robot implementation
    implementation 'com.robotemi:sdk:1.131.3'

    implementation "androidx.activity:activity:1.2.0-alpha04"
    implementation "androidx.fragment:fragment:1.3.0-alpha04"

    // room database implementation
    def room_version = "2.2.6"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation 'it.xabaras.android:recyclerview-swipedecorator:1.4'

    // EditText library
    def awesome_et_latest_version = "1.0.3"
    implementation "ss.anoop:awesome-textinput-layout:${awesome_et_latest_version}"

    // Hiding / Showing views Library
    implementation 'com.devlomi.hidely:hidely:1.0.0'

    // Menu Library
    implementation 'androidx.cardview:cardview:1.0.0'

    // TextView library for patrol page
    implementation 'com.tomer:fadingtextview:2.6'

    // butterknife dependencies
    implementation 'com.jakewharton:butterknife:10.2.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    // Seekbar Library
    implementation 'com.ramotion.fluidslider:fluid-slider:0.3.1'

    implementation 'com.github.GrenderG:Toasty:1.3.0'

    implementation 'com.google.code.gson:gson:2.8.6'
}